<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad1)"/>

  <!-- Decorative elements -->
  <circle cx="1700" cy="200" r="300" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1800" cy="400" r="200" fill="rgba(255,255,255,0.03)"/>
  <rect x="0" y="900" width="1920" height="180" fill="rgba(0,0,0,0.2)"/>

  <!-- Accent bar -->
  <rect x="100" y="340" width="8" height="120" fill="url(#accentGrad1)" rx="4"/>

  <!-- Title placeholder -->
  <text x="140" y="400" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
    מצגת עסקית מקצועית
  </text>

  <!-- Subtitle -->
  <text x="140" y="460" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.8)">
    תבנית מעוצבת לישיבות הנהלה והצגות פרויקטים
  </text>

  <!-- Content boxes -->
  <rect x="100" y="520" width="500" height="300" rx="16" fill="rgba(255,255,255,0.1)"/>
  <rect x="640" y="520" width="500" height="300" rx="16" fill="rgba(255,255,255,0.1)"/>
  <rect x="1180" y="520" width="640" height="300" rx="16" fill="rgba(255,255,255,0.1)"/>

  <!-- Icons in boxes -->
  <circle cx="350" cy="620" r="40" fill="url(#accentGrad1)"/>
  <circle cx="890" cy="620" r="40" fill="url(#accentGrad1)"/>
  <circle cx="1500" cy="620" r="40" fill="url(#accentGrad1)"/>

  <!-- Text lines in boxes -->
  <rect x="150" y="700" width="400" height="16" rx="8" fill="rgba(255,255,255,0.3)"/>
  <rect x="150" y="740" width="300" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <rect x="150" y="780" width="350" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>

  <rect x="690" y="700" width="400" height="16" rx="8" fill="rgba(255,255,255,0.3)"/>
  <rect x="690" y="740" width="280" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <rect x="690" y="780" width="320" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>

  <rect x="1230" y="700" width="540" height="16" rx="8" fill="rgba(255,255,255,0.3)"/>
  <rect x="1230" y="740" width="400" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <rect x="1230" y="780" width="480" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>

  <!-- Footer info -->
  <text x="100" y="980" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.6)">
    12 שקפים | יחס 16:9 | PPTX
  </text>

  <!-- Logo placeholder -->
  <rect x="1700" y="940" width="120" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
</svg>
